name: Deploy Demo to GitHub Pages

on:
  push:
    branches:
      - main
      - master

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4.2.0
        with:
          node-version: 22 # 👈 Upgraded to 22 to prevent Node 20 engine deprecation
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional # 👈 Uses clean install to properly download native Linux binaries

      - name: Build Library
        run: npm run build

      - name: Build Demo
        run: npm run build:demo

      - name: Setup Pages
        uses: actions/configure-pages@v5 # 👈 Bumped to v5 to clear Action runtime warnings

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist-demo'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
